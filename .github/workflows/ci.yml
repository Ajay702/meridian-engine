name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install --system -e '.[dev]'
      - run: ruff check src tests benchmarks
      - run: mypy src
      - run: pytest

  eval-gate:
    # Quality gate: a change that regresses retrieval or groundedness fails the build.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: >
          meridian eval examples/eval.jsonl --corpus examples/corpus --out eval-report.json
          --gate recall@k=0.9 --gate groundedness=0.8 --gate answer_match=0.8
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meridian:ci .
